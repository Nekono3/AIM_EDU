<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A10"/>
      <stop offset="60%" stop-color="#121024"/>
      <stop offset="100%" stop-color="#090B14"/>
    </linearGradient>
    <radialGradient id="glowIndigo" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laserScan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes scan-bar {
      0% { transform: translateY(18px); opacity: 0.2; }
      50% { opacity: 1; }
      100% { transform: translateY(135px); opacity: 0.2; }
    }
    @keyframes bubble-fill {
      0%, 100% { fill: #1E293B; stroke: #475569; }
      50% { fill: #38BDF8; stroke: #38BDF8; }
    }
    .scanner-line { animation: scan-bar 3s ease-in-out infinite alternate; }
    .bubble-detected { animation: bubble-fill 3s ease-in-out infinite alternate; }
    .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; }
    .font-mono { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; }
  </style>

  <rect x="10" y="10" width="1180" height="260" rx="16" fill="url(#bg3)" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="10" y="10" width="1180" height="260" rx="16" fill="url(#glowIndigo)"/>

  <!-- Left Content -->
  <g transform="translate(60, 55)">
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
    <circle cx="13" cy="13" r="3.5" fill="#818CF8"/>
    <text x="24" y="17" fill="#A5B4FC" font-size="11" font-weight="700" class="font-mono" letter-spacing="1.2">ACADEMIC SYSTEMS</text>

    <text x="0" y="72" fill="#FFFFFF" font-size="44" class="font-title">AIM <tspan fill="#818CF8">EDU</tspan></text>
    <text x="0" y="112" fill="#94A3B8" font-size="16" class="font-title">Automated OMR Exam Evaluation &amp; Multi-Campus Analytics Engine</text>

    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="155" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="12" y="19" fill="#38BDF8" font-size="12" font-weight="700" class="font-mono">20,000+ PAPERS</text>

      <rect x="165" y="0" width="145" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="177" y="19" fill="#818CF8" font-size="12" font-weight="700" class="font-mono">6 CAMPUSES</text>

      <rect x="320" y="0" width="145" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="332" y="19" fill="#34D399" font-size="12" font-weight="700" class="font-mono">SUBPIXEL OMR</text>
    </g>
  </g>

  <!-- Right Optical Sheet Scanner Visual -->
  <g transform="translate(800, 45)">
    <!-- Examination Paper Sheet -->
    <rect width="250" height="180" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <!-- Student Header -->
    <rect x="15" y="15" width="85" height="6" rx="3" fill="#64748B"/>
    <rect x="110" y="15" width="120" height="6" rx="3" fill="#334155"/>

    <!-- Simulated Bubble Grid Matrix -->
    <g transform="translate(20, 40)">
      <!-- Row 1 -->
      <circle cx="10" cy="10" r="5" class="bubble-detected"/>
      <circle cx="30" cy="10" r="5" fill="#1E293B" stroke="#475569"/>
      <circle cx="50" cy="10" r="5" fill="#1E293B" stroke="#475569"/>
      <circle cx="70" cy="10" r="5" fill="#1E293B" stroke="#475569"/>

      <!-- Row 2 -->
      <circle cx="10" cy="30" r="5" fill="#1E293B" stroke="#475569"/>
      <circle cx="30" cy="30" r="5" class="bubble-detected"/>
      <circle cx="50" cy="30" r="5" fill="#1E293B" stroke="#475569"/>
      <circle cx="70" cy="30" r="5" fill="#1E293B" stroke="#475569"/>

      <!-- Row 3 -->
      <circle cx="10" cy="50" r="5" fill="#1E293B" stroke="#475569"/>
      <circle cx="30" cy="50" r="5" fill="#1E293B" stroke="#475569"/>
      <circle cx="50" cy="50" r="5" class="bubble-detected"/>
      <circle cx="70" cy="50" r="5" fill="#1E293B" stroke="#475569"/>

      <!-- Row 4 -->
      <circle cx="10" cy="70" r="5" class="bubble-detected"/>
      <circle cx="30" cy="70" r="5" fill="#1E293B" stroke="#475569"/>
      <circle cx="50" cy="70" r="5" fill="#1E293B" stroke="#475569"/>
      <circle cx="70" cy="70" r="5" fill="#1E293B" stroke="#475569"/>

      <!-- Question Columns Right -->
      <circle cx="120" cy="10" r="5" fill="#1E293B" stroke="#475569"/>
      <circle cx="140" cy="10" r="5" class="bubble-detected"/>
      <circle cx="160" cy="10" r="5" fill="#1E293B" stroke="#475569"/>
      <circle cx="180" cy="10" r="5" fill="#1E293B" stroke="#475569"/>

      <circle cx="120" cy="30" r="5" class="bubble-detected"/>
      <circle cx="140" cy="30" r="5" fill="#1E293B" stroke="#475569"/>
      <circle cx="160" cy="30" r="5" fill="#1E293B" stroke="#475569"/>
      <circle cx="180" cy="30" r="5" fill="#1E293B" stroke="#475569"/>

      <circle cx="120" cy="50" r="5" fill="#1E293B" stroke="#475569"/>
      <circle cx="140" cy="50" r="5" fill="#1E293B" stroke="#475569"/>
      <circle cx="160" cy="50" r="5" class="bubble-detected"/>
      <circle cx="180" cy="50" r="5" fill="#1E293B" stroke="#475569"/>

      <circle cx="120" cy="70" r="5" fill="#1E293B" stroke="#475569"/>
      <circle cx="140" cy="70" r="5" class="bubble-detected"/>
      <circle cx="160" cy="70" r="5" fill="#1E293B" stroke="#475569"/>
      <circle cx="180" cy="70" r="5" fill="#1E293B" stroke="#475569"/>
    </g>

    <!-- Sweeping Optical Laser Beam -->
    <g class="scanner-line">
      <line x1="8" y1="0" x2="242" y2="0" stroke="url(#laserScan)" stroke-width="3"/>
      <line x1="15" y1="0" x2="235" y2="0" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.8"/>
    </g>
  </g>
</svg>